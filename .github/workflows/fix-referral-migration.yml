name: Fix referral migration matcher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-referral-migration.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix matcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/integrate_referral_dashboard.py')
          s=p.read_text()
          start=s.index('# 5) Add the left-side navigation item in the requested order.')
          end=s.index('# 6) Teach dashboard router to treat /refer as a native view.')
          block='''# 5) Add the left-side navigation item in the requested order.\np = SRC / "web_dashboard_markup.py"\ntext = p.read_text(encoding="utf-8")\nneedle = '>Account & Security</button><button class="nav" data-view="billing"'\nreplacement = '>Account & Security</button><button class="nav" data-view="referral" onclick="view(\\\'referral\\\',this)">Refer & Earn</button><button class="nav" data-view="billing"'\nif needle not in text:\n    raise SystemExit("dashboard nav marker not found")\ntext = text.replace(needle, replacement, 1)\np.write_text(text, encoding="utf-8")\n\n'''
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
          rm .github/workflows/fix-referral-migration.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix referral dashboard migration matcher'
          git push
