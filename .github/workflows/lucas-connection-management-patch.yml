name: Apply Lucas connection management update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lucas-connection-management-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Lucas dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/gpt_windows_connector/webapp.py')
          s = path.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {n}')
              s = s.replace(old, new, 1)

          once(
              '<div id="nodeModal" class="modal-backdrop hidden"><div class="modal"><h3>Computer Node</h3><p class="muted">Account access and security settings are controlled locally on the target computer.</p><div class="card"><div class="field"><label>Node ID</label><div id="manageNodeIdText" class="path"></div></div><div class="field"><label>Access mode</label><div id="managePermissionText"></div></div><div class="field"><label>Allowed folders</label><pre id="manageRootsText" class="details"></pre></div></div><div class="field"><label>Node log</label><pre id="manageLogs" class="details card" style="max-height:220px;overflow:auto">Full Access is required to read Node logs.</pre></div><div class="actions"><button class="btn secondary" onclick="loadNodeLogs()">Refresh logs</button><button class="btn secondary" onclick="closeModal(\'nodeModal\')">Close</button></div></div></div>',
              '<div id="nodeModal" class="modal-backdrop hidden"><div class="modal"><h3>Computer Node</h3><p class="muted">Account access and security settings are controlled locally on the target computer.</p><div class="card"><div class="field"><label>Computer name</label><div class="row"><input id="manageNodeName" class="input" maxlength="100"><button class="btn primary" style="flex:0 0 auto" onclick="saveNodeName()">Save</button></div></div><div class="field"><label>Node ID</label><div id="manageNodeIdText" class="path"></div></div><div class="field"><label>Access mode</label><div id="managePermissionText"></div></div><div class="field"><label>Allowed folders</label><pre id="manageRootsText" class="details"></pre></div></div><div class="field"><label>Node log</label><pre id="manageLogs" class="details card" style="max-height:220px;overflow:auto">Full Access is required to read Node logs.</pre></div><div class="actions"><button class="btn secondary" onclick="loadNodeLogs()">Refresh logs</button><button class="btn secondary" onclick="closeModal(\'nodeModal\')">Close</button></div></div></div>',
              'node modal'
          )

          once(
              '</div></div><div id="connectModal" class="modal-backdrop hidden">',
              '</div></div><div id="aiManageModal" class="modal-backdrop hidden"><div class="modal"><h3>Edit AI connection</h3><div class="field"><label>Name</label><input id="aiManageName" class="input" maxlength="100"></div><div class="field"><label>Note</label><textarea id="aiManageNote" class="input" maxlength="500" rows="4"></textarea></div><div class="actions"><button class="btn secondary" onclick="closeModal(\'aiManageModal\')">Close</button><button class="btn primary" onclick="saveAiConnection()">Save</button></div></div></div><div id="connectModal" class="modal-backdrop hidden">',
              'AI manage modal'
          )

          once(
              "'Computer Node':'电脑节点','Node ID':'Node ID'",
              "'Computer Node':'电脑节点','Computer name':'电脑名称','Node ID':'Node ID'",
              'node translations'
          )
          once(
              "'Add AI':'添加 AI','Add AI connection':'添加 AI 连接','Copy MCP URL':'复制 MCP URL','Registered AI / MCP clients':'已注册的 AI / MCP 客户端'",
              "'Add AI':'添加 AI','Add AI connection':'添加 AI 连接','Copy MCP URL':'复制 MCP URL','Registered AI / MCP clients':'已注册的 AI / MCP 客户端','Edit AI connection':'编辑 AI 连接','Name':'名称','Note':'备注','Edit':'编辑','Delete':'删除','Save':'保存'",
              'AI translations'
          )

          once(
              'function nodeRowHtml(n){return `<tr data-node-key="${encodeURIComponent(n.node_id)}"><td><b>${esc(n.name||n.node_id)}</b>',
              'function nodeRowHtml(n){return `<tr data-node-key="${encodeURIComponent(n.node_id)}"><td><b>${esc(n.display_name||n.name||n.node_id)}</b>',
              'node row display name'
          )

          once(
              "function renderAiClients(){if(!state.aiClients.length){aiClientTable.innerHTML='<div class=\"empty\">No OAuth clients registered yet.</div>';return}aiClientTable.innerHTML='<table class=\"table\"><thead><tr><th>Client</th><th>Registered</th></tr></thead><tbody>'+state.aiClients.map(c=>`<tr><td><b>${esc(c.client_name||'MCP Client')}</b></td><td>${esc(timefmt(c.created_at))}</td></tr>`).join('')+'</tbody></table>'}",
              "function renderAiClients(){if(!state.aiClients.length){aiClientTable.innerHTML='<div class=\"empty\">No OAuth clients registered yet.</div>';return}aiClientTable.innerHTML='<table class=\"table\"><thead><tr><th>Name</th><th>Note</th><th>Registered</th><th></th></tr></thead><tbody>'+state.aiClients.map(c=>`<tr><td><b>${esc(c.display_name||c.client_name||'MCP Client')}</b><div class=\"muted path\">${esc(c.client_id)}</div></td><td>${esc(c.note||'—')}</td><td>${esc(timefmt(c.created_at))}</td><td><div class=\"toolbar\" style=\"margin:0;justify-content:flex-end\"><button class=\"btn secondary\" onclick=\"editAiConnection('${encodeURIComponent(c.client_id)}')\">Edit</button><button class=\"btn danger\" onclick=\"deleteAiConnection('${encodeURIComponent(c.client_id)}')\">Delete</button></div></td></tr>`).join('')+'</tbody></table>'}",
              'AI table'
          )

          once(
              "function openNodeModal(id){managedNodeId=decodeURIComponent(id);const n=state.nodes.find(x=>x.node_id===managedNodeId);if(!n)return;manageNodeIdText.textContent=n.node_id;managePermissionText.textContent=accessMode(n);manageRootsText.textContent=(n.allowed_roots||[]).join('\\n')||'—';manageLogs.textContent='Full Access is required to read Node logs.';nodeModal.classList.remove('hidden')}",
              "function openNodeModal(id){managedNodeId=decodeURIComponent(id);const n=state.nodes.find(x=>x.node_id===managedNodeId);if(!n)return;manageNodeName.value=n.display_name||n.name||n.node_id;manageNodeIdText.textContent=n.node_id;managePermissionText.textContent=accessMode(n);manageRootsText.textContent=(n.allowed_roots||[]).join('\\n')||'—';manageLogs.textContent='Full Access is required to read Node logs.';nodeModal.classList.remove('hidden')}\nasync function saveNodeName(){if(!managedNodeId)return;const name=manageNodeName.value.trim();try{const d=await api('/api/nodes/'+encodeURIComponent(managedNodeId)+'/name',{method:'PUT',body:JSON.stringify({name})});const n=state.nodes.find(x=>x.node_id===managedNodeId);if(n)n.display_name=d.display_name||n.name||n.node_id;renderNodes();toast('Computer name saved')}catch(e){toast(e.message)}}",
              'node edit JS'
          )

          once(
              "function updateAiHelp(){const n=aiClientType.value;const tips={ChatGPT:'Create a custom MCP app, use the Lucas MCP URL, choose OAuth, then scan tools.',Claude:'Add Lucas as a remote MCP connector and use OAuth when prompted.',Gemini:'Add Lucas through an MCP-compatible integration and authorize with Lucas OAuth.',Cursor:'Add a remote MCP server using the Lucas MCP URL and complete OAuth authorization.',Codex:'Configure Lucas as a remote MCP server using the URL shown above.','Claude Code':'Configure Lucas as a remote MCP server using the URL shown above.','Other MCP client':'Use Streamable HTTP with the Lucas MCP URL. OAuth metadata and dynamic client registration are published automatically.'};aiHelp.textContent=tips[n]||tips['Other MCP client']}",
              "function updateAiHelp(){const n=aiClientType.value;const tips={ChatGPT:'Create a custom MCP app, use the Lucas MCP URL, choose OAuth, then scan tools.',Claude:'Add Lucas as a remote MCP connector and use OAuth when prompted.',Gemini:'Add Lucas through an MCP-compatible integration and authorize with Lucas OAuth.',Cursor:'Add a remote MCP server using the Lucas MCP URL and complete OAuth authorization.',Codex:'Configure Lucas as a remote MCP server using the URL shown above.','Claude Code':'Configure Lucas as a remote MCP server using the URL shown above.','Other MCP client':'Use Streamable HTTP with the Lucas MCP URL. OAuth metadata and dynamic client registration are published automatically.'};aiHelp.textContent=tips[n]||tips['Other MCP client']}\nlet managedAiClientId=null;\nfunction editAiConnection(id){managedAiClientId=decodeURIComponent(id);const c=state.aiClients.find(x=>x.client_id===managedAiClientId);if(!c)return;aiManageName.value=c.display_name||c.client_name||'MCP Client';aiManageNote.value=c.note||'';aiManageModal.classList.remove('hidden');setTimeout(()=>aiManageName.focus(),50)}\nasync function saveAiConnection(){if(!managedAiClientId)return;try{await api('/api/ai-connections/'+encodeURIComponent(managedAiClientId),{method:'PUT',body:JSON.stringify({display_name:aiManageName.value.trim(),note:aiManageNote.value.trim()})});closeModal('aiManageModal');await refresh();toast('AI connection saved')}catch(e){toast(e.message)}}\nasync function deleteAiConnection(id){const clientId=decodeURIComponent(id),c=state.aiClients.find(x=>x.client_id===clientId);if(!confirm('Delete AI connection '+(c?.display_name||c?.client_name||'MCP Client')+'?'))return;try{await api('/api/ai-connections/'+encodeURIComponent(clientId),{method:'DELETE'});await refresh();toast('AI connection deleted')}catch(e){toast(e.message)}}",
              'AI manage JS'
          )

          once(
              "def _db() -> sqlite3.Connection:\n    db = sqlite3.connect(gateway.db_path, timeout=30)\n    db.row_factory = sqlite3.Row\n    return db\n",
              "def _db() -> sqlite3.Connection:\n    db = sqlite3.connect(gateway.db_path, timeout=30)\n    db.row_factory = sqlite3.Row\n    return db\n\n\ndef _ensure_dashboard_metadata_schema(db: sqlite3.Connection) -> None:\n    db.executescript(\"\"\"\n    CREATE TABLE IF NOT EXISTS dashboard_node_metadata(\n        user_id TEXT NOT NULL, node_id TEXT NOT NULL, display_name TEXT, updated_at REAL NOT NULL,\n        PRIMARY KEY(user_id,node_id)\n    );\n    CREATE TABLE IF NOT EXISTS dashboard_ai_metadata(\n        user_id TEXT NOT NULL, client_id TEXT NOT NULL, display_name TEXT, note TEXT, updated_at REAL NOT NULL,\n        PRIMARY KEY(user_id,client_id)\n    );\n    \"\"\")\n",
              'metadata schema'
          )

          once(
              "async def api_nodes(request: Request):\n    user = _auth_user(request)\n    return JSONResponse({\"nodes\": await gateway.registry.list(user)})\n",
              "async def api_nodes(request: Request):\n    user = _auth_user(request)\n    nodes = await gateway.registry.list(user)\n    with _db() as db:\n        _ensure_dashboard_metadata_schema(db)\n        rows = db.execute(\"SELECT node_id,display_name FROM dashboard_node_metadata WHERE user_id=?\", (user.id,)).fetchall()\n    aliases = {r[\"node_id\"]: r[\"display_name\"] for r in rows if r[\"display_name\"]}\n    for node in nodes:\n        node[\"display_name\"] = aliases.get(node[\"node_id\"]) or node.get(\"name\") or node[\"node_id\"]\n    return JSONResponse({\"nodes\": nodes})\n\n\nasync def api_node_name(request: Request):\n    user = _auth_user(request)\n    node_id = unquote(request.path_params[\"node_id\"])\n    nodes = await gateway.registry.list(user)\n    node = next((n for n in nodes if n.get(\"node_id\") == node_id), None)\n    if not node:\n        return JSONResponse({\"error\": \"Node not found\"}, status_code=404)\n    body = await request.json()\n    name = str(body.get(\"name\") or \"\").strip()[:100]\n    with _db() as db:\n        _ensure_dashboard_metadata_schema(db)\n        if name:\n            db.execute(\"INSERT INTO dashboard_node_metadata(user_id,node_id,display_name,updated_at) VALUES(?,?,?,?) ON CONFLICT(user_id,node_id) DO UPDATE SET display_name=excluded.display_name,updated_at=excluded.updated_at\", (user.id,node_id,name,time.time()))\n        else:\n            db.execute(\"DELETE FROM dashboard_node_metadata WHERE user_id=? AND node_id=?\", (user.id,node_id))\n    gateway.auth.audit(user.id, \"node.rename\", node_id, {\"display_name\": name})\n    return JSONResponse({\"ok\": True, \"display_name\": name or node.get(\"name\") or node_id})\n",
              'node metadata API'
          )

          once(
              "async def api_ai_connections(request: Request):\n    user = _auth_user(request)\n    with _db() as db:\n        rows = db.execute(\n            \"\"\"SELECT c.client_id,c.client_name,c.created_at\n               FROM oauth_clients c\n               JOIN oauth_client_users cu ON cu.client_id=c.client_id\n              WHERE cu.user_id=?\n              ORDER BY cu.authorized_at DESC,c.created_at DESC\"\"\",\n            (user.id,),\n        ).fetchall()\n    return JSONResponse({\"clients\": [{\"client_id\": r[\"client_id\"], \"client_name\": r[\"client_name\"], \"created_at\": r[\"created_at\"]} for r in rows]})\n",
              "async def api_ai_connections(request: Request):\n    user = _auth_user(request)\n    with _db() as db:\n        _ensure_dashboard_metadata_schema(db)\n        rows = db.execute(\n            \"\"\"SELECT c.client_id,c.client_name,c.created_at,m.display_name,m.note\n               FROM oauth_clients c\n               JOIN oauth_client_users cu ON cu.client_id=c.client_id\n               LEFT JOIN dashboard_ai_metadata m ON m.client_id=c.client_id AND m.user_id=cu.user_id\n              WHERE cu.user_id=?\n              ORDER BY cu.authorized_at DESC,c.created_at DESC\"\"\",\n            (user.id,),\n        ).fetchall()\n    return JSONResponse({\"clients\": [{\"client_id\": r[\"client_id\"], \"client_name\": r[\"client_name\"], \"display_name\": r[\"display_name\"] or r[\"client_name\"], \"note\": r[\"note\"] or \"\", \"created_at\": r[\"created_at\"]} for r in rows]})\n\n\nasync def api_ai_connection(request: Request):\n    user = _auth_user(request)\n    client_id = unquote(request.path_params[\"client_id\"])\n    with _db() as db:\n        _ensure_dashboard_metadata_schema(db)\n        row = db.execute(\"SELECT c.client_name FROM oauth_clients c JOIN oauth_client_users cu ON cu.client_id=c.client_id WHERE c.client_id=? AND cu.user_id=?\", (client_id,user.id)).fetchone()\n        if not row:\n            return JSONResponse({\"error\": \"AI connection not found\"}, status_code=404)\n        if request.method == \"DELETE\":\n            db.execute(\"DELETE FROM oauth_refresh_tokens WHERE client_id=? AND user_id=?\", (client_id,user.id))\n            db.execute(\"DELETE FROM oauth_codes WHERE client_id=? AND user_id=?\", (client_id,user.id))\n            db.execute(\"DELETE FROM oauth_client_users WHERE client_id=? AND user_id=?\", (client_id,user.id))\n            db.execute(\"DELETE FROM dashboard_ai_metadata WHERE client_id=? AND user_id=?\", (client_id,user.id))\n            gateway.auth.audit(user.id, \"oauth.disconnect\", client_id)\n            return JSONResponse({\"ok\": True})\n        body = await request.json()\n        display_name = str(body.get(\"display_name\") or \"\").strip()[:100]\n        note = str(body.get(\"note\") or \"\").strip()[:500]\n        db.execute(\"INSERT INTO dashboard_ai_metadata(user_id,client_id,display_name,note,updated_at) VALUES(?,?,?,?,?) ON CONFLICT(user_id,client_id) DO UPDATE SET display_name=excluded.display_name,note=excluded.note,updated_at=excluded.updated_at\", (user.id,client_id,display_name or None,note or None,time.time()))\n    gateway.auth.audit(user.id, \"oauth.connection_update\", client_id, {\"display_name\": display_name, \"has_note\": bool(note)})\n    return JSONResponse({\"ok\": True, \"display_name\": display_name or row[\"client_name\"], \"note\": note})\n",
              'AI metadata API'
          )

          once(
              '    Route("/api/nodes/{node_id}/logs", api_node_logs, methods=["GET"]),\n    Route("/api/nodes/{node_id}/folders", api_folders, methods=["GET"]),\n    Route("/api/ai-connections", api_ai_connections, methods=["GET"]),',
              '    Route("/api/nodes/{node_id}/logs", api_node_logs, methods=["GET"]),\n    Route("/api/nodes/{node_id}/folders", api_folders, methods=["GET"]),\n    Route("/api/nodes/{node_id}/name", api_node_name, methods=["PUT"]),\n    Route("/api/ai-connections", api_ai_connections, methods=["GET"]),\n    Route("/api/ai-connections/{client_id}", api_ai_connection, methods=["PUT","DELETE"]),',
              'routes'
          )

          path.write_text(s, encoding='utf-8')

          test = Path('tests/test_dashboard_connection_metadata.py')
          test.write_text('''import sqlite3\n\nfrom gpt_windows_connector.webapp import _ensure_dashboard_metadata_schema\n\n\ndef test_dashboard_metadata_schema_is_user_scoped():\n    db = sqlite3.connect(\":memory:\")\n    _ensure_dashboard_metadata_schema(db)\n    db.execute(\"INSERT INTO dashboard_node_metadata(user_id,node_id,display_name,updated_at) VALUES(?,?,?,?)\", (\"u1\",\"n1\",\"Office\",1))\n    db.execute(\"INSERT INTO dashboard_node_metadata(user_id,node_id,display_name,updated_at) VALUES(?,?,?,?)\", (\"u2\",\"n1\",\"Home\",1))\n    rows = db.execute(\"SELECT user_id,display_name FROM dashboard_node_metadata WHERE node_id=? ORDER BY user_id\", (\"n1\",)).fetchall()\n    assert rows == [(\"u1\",\"Office\"),(\"u2\",\"Home\")]\n\n\ndef test_ai_metadata_supports_name_and_note_per_user():\n    db = sqlite3.connect(\":memory:\")\n    _ensure_dashboard_metadata_schema(db)\n    db.execute(\"INSERT INTO dashboard_ai_metadata(user_id,client_id,display_name,note,updated_at) VALUES(?,?,?,?,?)\", (\"u1\",\"c1\",\"Work ChatGPT\",\"finance\",1))\n    row = db.execute(\"SELECT display_name,note FROM dashboard_ai_metadata WHERE user_id=? AND client_id=?\", (\"u1\",\"c1\")).fetchone()\n    assert row == (\"Work ChatGPT\",\"finance\")\n''', encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m compileall -q src
          python -m pytest -q
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Lucas Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/lucas-connection-management-patch.yml
          git add src/gpt_windows_connector/webapp.py tests/test_dashboard_connection_metadata.py
          git commit -m "Add editable node and AI connection metadata"
          git push origin HEAD:main
