name: Apply in-app updater

on:
  push:
    paths:
      - '.github/workflows/apply-in-app-updater.yml'
      - '.github/scripts/apply_in_app_updater.py'
      - '.deploy-trigger'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch updater implementation
        run: python .github/scripts/apply_in_app_updater.py
      - name: Validate
        run: |
          python -m compileall -q src
          python -m pytest -q tests/test_update_ui_contract.py tests/test_install_config_preservation.py tests/test_tray.py
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet -- src/gpt_windows_connector/settings_ui.py scripts/install-node.ps1 tests/test_update_ui_contract.py; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gpt_windows_connector/settings_ui.py scripts/install-node.ps1 tests/test_update_ui_contract.py
          git commit -m 'Show Lucas updates inside the app'
          git push origin HEAD:main
