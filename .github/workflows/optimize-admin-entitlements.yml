name: Optimize admin entitlements
on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize_admin_entitlements.py'
      - '.github/workflows/optimize-admin-entitlements.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply optimization
        run: python scripts/optimize_admin_entitlements.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest -q
      - name: Cleanup one-shot files
        run: |
          rm scripts/optimize_admin_entitlements.py
          rm .github/workflows/optimize-admin-entitlements.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Optimize admin entitlement expiry controls'
          git push origin HEAD:main
