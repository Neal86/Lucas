name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging, fix/history-response-ownership-20261016, fix/release-contract-20261016, fix/desktop-account-auth-20261017]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest -q
      - name: Install Chromium for browser E2E
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python -m playwright install --with-deps chromium
      - name: Chromium extension integration (direct CDP)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        shell: bash
        run: |
          CHROME_BIN="$(find ~/.cache/ms-playwright -type f -name chrome | head -n 1)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          export RUN_EXTENSION_E2E=1
          pytest -q tests/test_extension_chromium.py
      - name: Chromium web onboarding integration (direct CDP, synthetic email delivery)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        shell: bash
        run: |
          CHROME_BIN="$(find ~/.cache/ms-playwright -type f -name chrome | head -n 1)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          export RUN_LOGIN_E2E=1
          pytest -q tests/test_oauth_login_chromium.py tests/test_computer_node_docs_chromium.py tests/test_computer_connection_chromium.py tests/test_ai_connection_editor_chromium.py tests/test_billing_read_chromium.py tests/test_session_lifecycle_chromium.py tests/test_computer_management_chromium.py tests/test_web_acceptance_chromium.py
