<div class="row"><a class="button" href="https://chatgpt.com/" target="_blank" rel="noreferrer">ChatGPT</a><a class="button" href="https://claude.ai/" target="_blank" rel="noreferrer">Claude</a><a class="button" href="https://gemini.google.com/" target="_blank" rel="noreferrer">Gemini</a></div>
