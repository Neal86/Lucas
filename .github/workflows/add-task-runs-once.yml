name: Add Task Runs once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-task-runs-once.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Task Runs migration
        run: python scripts/apply-task-runs.py
      - name: Validate
        run: |
          python -m compileall -q src
          python - <<'PY'
          from pathlib import Path
          assert Path('src/gpt_windows_connector/task_runs.py').exists()
          assert 'task_runs.record_operation' in Path('src/gpt_windows_connector/gateway.py').read_text()
          assert 'local_task_runs.record_operation' in Path('src/gpt_windows_connector/node.py').read_text()
          assert '/api/task-runs' in Path('src/gpt_windows_connector/webapp.py').read_text()
          assert '任务记录' in Path('src/gpt_windows_connector/settings_ui.py').read_text()
          PY
      - name: Remove migration files
        run: rm -f scripts/apply-task-runs.py .github/workflows/add-task-runs-once.yml
      - name: Commit Task Runs
        run: |
          git config user.name "Neal86"
          git config user.email "52608308+Neal86@users.noreply.github.com"
          git add -A
          git commit -m "Add Task Runs timing history [skip ci]"
          git push
