name: Fix Lucas sidebar logo delivery
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_sidebar_logo_delivery.py'
      - '.github/workflows/fix-sidebar-logo-delivery.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_sidebar_logo_delivery.py
      - run: python -m compileall -q src
      - run: |
          rm scripts/fix_sidebar_logo_delivery.py
          rm .github/workflows/fix-sidebar-logo-delivery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Serve exact white Lucas sidebar logo'
          git push origin HEAD:main
