name: Lucas access hardening

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_access_hardening.py
      - .github/workflows/access-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed access hardening
        run: python scripts/apply_access_hardening.py
      - name: Install test dependencies
        run: pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src
      - name: Run regression suite against known baseline
        run: >-
          pytest -q
          --deselect=tests/test_registration_security.py::test_verification_code_is_single_use_and_attempt_limited
          --deselect=tests/test_routing_isolation.py::test_ai_connections_are_isolated_by_user
      - name: Commit hardened implementation
        run: |
          git config user.name 'Lucas Security Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f scripts/apply_access_hardening.py .github/workflows/access-hardening.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Harden local user access and remove legacy permissions'
          git push origin HEAD:main
