name: Apply Lucas taskbar icon

on:
  push:
    paths:
      - '.github/workflows/apply-taskbar-icon.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch taskbar icon
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/gpt_windows_connector/settings_ui.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('from .update_ui import InAppUpdater\n', 'from .update_ui import InAppUpdater\nfrom .app_icon import make_square_icon, set_windows_app_id\n', 1)
          s = s.replace('    root = tk.Tk()\n', '    set_windows_app_id()\n    root = tk.Tk()\n', 1)
          old = '''    window_icon_image=None\n    try:\n        icon=Image.open(Path(__file__).with_name("assets")/"lucas-logo-square.png").convert("RGBA")\n        icon.thumbnail((64,64),Image.Resampling.LANCZOS)\n        window_icon_image=ImageTk.PhotoImage(icon)\n        root.iconphoto(True,window_icon_image)\n    except Exception:\n        pass\n'''
          new = '''    window_icon_image=None\n    try:\n        # Use the same square white-tile Lucas branding as the tray icon.\n        # Explicit AppUserModelID above prevents Windows from showing pythonw.exe.\n        window_icon_image=ImageTk.PhotoImage(make_square_icon(size=64))\n        root.iconphoto(True,window_icon_image)\n    except Exception:\n        pass\n'''
          if old not in s:
              raise SystemExit('settings icon block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/gpt_windows_connector/tray.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('from .i18n import tr\n', 'from .i18n import tr\nfrom .app_icon import make_square_icon\n', 1)
          start = s.index('    def _make_icon(self, status: str) -> Any:\n')
          end = s.index('\n    def _refresh_icon', start)
          replacement = '''    def _make_icon(self, status: str) -> Any:\n        return make_square_icon(status=status, size=64)\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

          p = Path('pyproject.toml')
          s = p.read_text(encoding='utf-8').replace('version = "1.7.27"', 'version = "1.7.28"', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m compileall -q src
          python - <<'PY'
          from pathlib import Path
          s=Path('src/gpt_windows_connector/settings_ui.py').read_text(encoding='utf-8')
          t=Path('src/gpt_windows_connector/tray.py').read_text(encoding='utf-8')
          assert 'set_windows_app_id()' in s
          assert 'make_square_icon(size=64)' in s
          assert 'return make_square_icon(status=status, size=64)' in t
          assert 'version = "1.7.28"' in Path('pyproject.toml').read_text(encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gpt_windows_connector/settings_ui.py src/gpt_windows_connector/tray.py pyproject.toml
          git commit -m 'Use Lucas tray branding for Windows taskbar icon'
          git push origin HEAD:main
