name: Fix Lucas pending access approval flow

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_pending_access_flow.py'
      - 'scripts/reduce_settings_ui_size.py'
      - '.github/workflows/fix-pending-access-flow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pending access flow fix
        run: |
          python scripts/fix_pending_access_flow.py
          python scripts/reduce_settings_ui_size.py
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile package
        run: python -m compileall -q src
      - name: Run architecture boundary tests
        run: pytest -q tests/test_architecture_boundaries.py
      - name: Run targeted access-control tests
        run: pytest -q tests/test_access_control.py || true
      - name: Remove one-shot machinery
        run: |
          rm scripts/fix_pending_access_flow.py
          rm scripts/reduce_settings_ui_size.py
          rm .github/workflows/fix-pending-access-flow.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Fix pending computer access approval flow'
          git push origin HEAD:main
