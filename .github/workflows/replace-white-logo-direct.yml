name: Replace white Lucas logo direct
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-white-logo-direct.yml'
permissions:
  contents: write
jobs:
  replace-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify exact uploaded PNG source
        shell: bash
        run: |
          test "$(sha256sum scripts/.logo2_0a | cut -d' ' -f1)" = "f3ab145c131d26f902024df2040432122960038c9fb00762744e3f7b784cac14"
          test "$(sha256sum scripts/.logo2_0b | cut -d' ' -f1)" = "639911e770fc0cf9f856a8ef102d0776f04c5890cf059ad3383cdf7813b91758"
          test "$(sha256sum scripts/.logo2_0c | cut -d' ' -f1)" = "fac1bcf98022efbd3131cdb6de9f780ab8734da71774645f96f85299ff388b5d"
          test "$(sha256sum scripts/.logo2_0d | cut -d' ' -f1)" = "5b6fc205874a8fdfcfec4dec7f05bdd486899852c0a94368e185a904626969c6"
          test "$(sha256sum scripts/.logo2_0e | cut -d' ' -f1)" = "09ff85572217f75f0f77ff856d8755d56acbacd2c42cdf643a321eca28793c35"
          test "$(sha256sum scripts/.logo2_0f | cut -d' ' -f1)" = "fca6bbd8b2c6004f7cf809cec8cd3488017c765a2d0d5b1a073f416eb8939623"
          test "$(sha256sum scripts/.logo2_0_tail | cut -d' ' -f1)" = "cd5db595677168b87ba8cc85f77dd91a9f5aa3b16e43d7c708cb13f00308c907"
          test "$(sha256sum scripts/.logo2_1 | cut -d' ' -f1)" = "38daf71a3b55a3d05a474197c081410ebc76ab3f73d89fa0e7f7f83d516a62cc"
          test "$(sha256sum scripts/.logo2_2 | cut -d' ' -f1)" = "7f765774287928f89a33f646fcf7f996a64cb858a5aa6287dfa73ffcfe6687dc"
          test "$(sha256sum scripts/.logo2_3 | cut -d' ' -f1)" = "b78d14caab0d0e73c2d7453e053c9bb5a8b818ea0b44c519b5f3bdc053a8f0d1"
          cat scripts/.logo2_0a scripts/.logo2_0b scripts/.logo2_0c scripts/.logo2_0d scripts/.logo2_0e scripts/.logo2_0f scripts/.logo2_0_tail scripts/.logo2_1 scripts/.logo2_2 scripts/.logo2_3 | base64 -d > src/gpt_windows_connector/assets/lucas-logo-horizontal-white.png
          test "$(stat -c%s src/gpt_windows_connector/assets/lucas-logo-horizontal-white.png)" = "26714"
          test "$(sha256sum src/gpt_windows_connector/assets/lucas-logo-horizontal-white.png | cut -d' ' -f1)" = "f0e1b4a65c311e388ebc92798187f6de69078935c3b7e2c8e3c6ce733a2bfeef"
          file src/gpt_windows_connector/assets/lucas-logo-horizontal-white.png | grep -q 'PNG image data, 400 x 157'
      - name: Switch server to direct PNG file
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/gpt_windows_connector/server.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import base64\n', '')
          s = s.replace('from starlette.responses import FileResponse, JSONResponse, Response', 'from starlette.responses import FileResponse, JSONResponse')
          s = s.replace('WHITE_LOGO_URL = "/assets/lucas-logo-horizontal-white.png?v=source-b64-20260902"', 'WHITE_LOGO_URL = "/assets/lucas-logo-horizontal-white.png?v=exact-f0e1b4a6"')
          start = s.index('def _load_white_logo_bytes() -> bytes:')
          end = s.index('\n\nasync def blue_logo_asset', start)
          direct = '''async def white_logo_asset(request):\n    return FileResponse(\n        webapp.BRAND_ASSET_DIR / "lucas-logo-horizontal-white.png",\n        media_type="image/png",\n        headers={"Cache-Control": "no-store, no-cache, must-revalidate, max-age=0"},\n    )\n'''
          p.write_text(s[:start] + direct + s[end:], encoding='utf-8')
      - name: Clean temporary transport files and validate
        shell: bash
        run: |
          rm -f scripts/.logo_upload_chunk0 scripts/.logo_upload_chunk1 scripts/.logo_upload_chunk2
          rm -f scripts/.logo2_0 scripts/.logo2_0_tail scripts/.logo2_0a scripts/.logo2_0b scripts/.logo2_0c scripts/.logo2_0d scripts/.logo2_0e scripts/.logo2_0f scripts/.logo2_1 scripts/.logo2_2 scripts/.logo2_3
          rm -f .github/workflows/replace-white-logo-direct.yml
          python -m compileall -q src/gpt_windows_connector/server.py
          ! grep -q 'lucas-logo-white.png.b64' src/gpt_windows_connector/server.py
      - name: Commit exact PNG
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use exact uploaded white Lucas logo PNG directly'
          git push origin main
# final verified small-segment reconstruction
