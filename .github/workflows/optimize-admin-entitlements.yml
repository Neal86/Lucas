name: Optimize admin entitlements
on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize_admin_entitlements.py'
      - '.github/workflows/optimize-admin-entitlements.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve valid admin runtime
        run: cp src/gpt_windows_connector/web_admin_runtime.py /tmp/web_admin_runtime.py
      - name: Apply optimization
        run: python scripts/optimize_admin_entitlements.py
      - name: Rebuild admin runtime safely
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src=Path('/tmp/web_admin_runtime.py').read_text(encoding='utf-8')
          js=ast.literal_eval(src.split('ADMIN_SCRIPT = ',1)[1].strip())
          old="async function saveAdminUser(id){await api('/api/admin/users/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({status:adminDetailStatus.value,plan:adminDetailPlan.value,bonus_requests:+adminDetailBonus.value||0,bonus_nodes:+adminDetailBonusNodes.value||0,bonus_ai_accounts:+adminDetailBonusAi.value||0})});toast('User updated');await showAdminUser(id)}"
          new="function adminExpiryValue(){const mode=adminDetailExpiry.value;if(mode==='never')return null;if(mode==='7d')return Date.now()/1000+7*86400;if(mode==='30d')return Date.now()/1000+30*86400;if(mode==='custom'){const v=adminDetailExpiryCustom.value;if(!v)throw new Error('Choose an expiration date');return new Date(v).getTime()/1000}return null}\nfunction adminExpiryModeChange(){if(window.adminDetailExpiryCustom)adminDetailExpiryCustom.classList.toggle('hidden',adminDetailExpiry.value!=='custom')}\nasync function saveAdminUser(id){try{await api('/api/admin/users/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({status:adminDetailStatus.value,plan:adminDetailPlan.value,bonus_requests:+adminDetailBonus.value||0,bonus_nodes:+adminDetailBonusNodes.value||0,bonus_ai_accounts:+adminDetailBonusAi.value||0,override_expires_at:adminExpiryValue()})});toast('User updated');await showAdminUser(id)}catch(e){toast(e.message)}}"
          if old not in js: raise SystemExit('saveAdminUser marker missing')
          js=js.replace(old,new,1)
          old_ui='<div><b>Extra AI accounts</b><input id="adminDetailBonusAi" class="input" type="number" min="0" value="${esc((d.admin_overrides||{}).bonus_ai_accounts||0)}"></div></div><div class="actions"><button class="btn primary" onclick="saveAdminUser(\'${u.id}\')">Save account</button></div>'
          new_ui='<div><b>Extra AI accounts</b><input id="adminDetailBonusAi" class="input" type="number" min="0" value="${esc((d.admin_overrides||{}).bonus_ai_accounts||0)}"></div><div><b>Extra quota expires</b><select id="adminDetailExpiry" onchange="adminExpiryModeChange()"><option value="never">Never</option><option value="7d">7 days</option><option value="30d">30 days</option><option value="custom">Custom</option></select><input id="adminDetailExpiryCustom" class="input hidden" type="datetime-local"></div></div><div class="muted" style="margin-top:10px">${d.admin_overrides?.expired?\'Extra quota expired\':(d.admin_overrides?.expires_at?\'Extra quota expires \'+new Date(d.admin_overrides.expires_at*1000).toLocaleString():\'Extra quota does not expire\')}</div><div class="actions"><button class="btn primary" onclick="saveAdminUser(\'${u.id}\')">Save account</button></div>'
          if old_ui not in js: raise SystemExit('admin override UI marker missing')
          js=js.replace(old_ui,new_ui,1)
          old_tail="`;adminUserModal.classList.remove('hidden')}"
          new_tail="`;adminUserModal.classList.remove('hidden');if(d.admin_overrides?.expires_at){adminDetailExpiry.value='custom';adminDetailExpiryCustom.classList.remove('hidden');const dt=new Date(d.admin_overrides.expires_at*1000);adminDetailExpiryCustom.value=new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16)}}"
          if old_tail not in js: raise SystemExit('admin modal tail marker missing')
          js=js.replace(old_tail,new_tail,1)
          Path('src/gpt_windows_connector/web_admin_runtime.py').write_text('from __future__ import annotations\n\nADMIN_SCRIPT = '+repr(js)+'\n',encoding='utf-8')
          PY
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest -q
      - name: Cleanup one-shot files
        run: |
          rm scripts/optimize_admin_entitlements.py
          rm .github/workflows/optimize-admin-entitlements.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Optimize admin entitlement expiry controls'
          git push origin HEAD:main
