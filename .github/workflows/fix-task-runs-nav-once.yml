name: Fix Task Runs local nav once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-task-runs-nav-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fix local Task Runs navigation
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/gpt_windows_connector/settings_ui.py')
          s=p.read_text(encoding='utf-8')
          old='desc={"常规":"连接身份与此电脑的 Lucas 基础配置。","安全":"控制 AI 在这台电脑上可以执行的操作。安全设置只能在本机修改。","文件访问":"使用 Allowed Folders 建立文件与工作区的硬边界。","网络":"控制互联网、局域网、域名与后台网络请求。","规则":"管理本机审批时展示的安全规则。","系统访问":"查看 Lucas 与 Windows 管理员权限的实际状态。"}'
          new='desc={"常规":"连接身份与此电脑的 Lucas 基础配置。","安全":"控制 AI 在这台电脑上可以执行的操作。安全设置只能在本机修改。","文件访问":"使用 Allowed Folders 建立文件与工作区的硬边界。","网络":"控制互联网、局域网、域名与后台网络请求。","规则":"管理本机审批时展示的安全规则。","任务记录":"查看本机 Lucas 大任务与小任务执行时间。","系统访问":"查看 Lucas 与 Windows 管理员权限的实际状态。"}'
          if old not in s: raise SystemExit('description block not found')
          s=s.replace(old,new,1)
          old='for name in ("常规","安全","文件访问","网络","规则","系统访问"):'
          new='for name in ("常规","安全","文件访问","网络","规则","任务记录","系统访问"):'
          if old not in s: raise SystemExit('navigation tuple not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          q=Path('pyproject.toml')
          t=q.read_text(encoding='utf-8')
          if 'version = "1.7.10"' not in t: raise SystemExit('expected version 1.7.10')
          q.write_text(t.replace('version = "1.7.10"','version = "1.7.11"',1),encoding='utf-8')
      - name: Validate
        run: |
          python -m compileall -q src
          python - <<'PY'
          from pathlib import Path
          s=Path('src/gpt_windows_connector/settings_ui.py').read_text(encoding='utf-8')
          assert '"任务记录":"查看本机 Lucas 大任务与小任务执行时间。"' in s
          assert 'for name in ("常规","安全","文件访问","网络","规则","任务记录","系统访问"):' in s
          assert 'version = "1.7.11"' in Path('pyproject.toml').read_text()
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-task-runs-nav-once.yml
      - name: Commit fix
        run: |
          git config user.name "Neal86"
          git config user.email "52608308+Neal86@users.noreply.github.com"
          git add -A
          git commit -m "Expose local Task Runs page [skip ci]"
          git push
