name: Fix config preservation once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-config-preservation-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preserve complete local config across updates
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('scripts/install-node.ps1')
          s = p.read_text(encoding='utf-8')

          old = '''$ExistingConfig = $null
          if (Test-Path $ConfigFile) {
            try { $ExistingConfig = Get-Content -Raw -Path $ConfigFile | ConvertFrom-Json } catch { $ExistingConfig = $null }
          }'''
          new = '''$ExistingConfig = $null
          $ExistingConfigRaw = $null
          $ConfigBackupFile = "$ConfigFile.pre-update"
          if (Test-Path $ConfigFile) {
            try {
              $ExistingConfigRaw = Get-Content -Raw -Path $ConfigFile
              $ExistingConfig = $ExistingConfigRaw | ConvertFrom-Json -ErrorAction Stop
              Copy-Item -Force -Path $ConfigFile -Destination $ConfigBackupFile
            } catch {
              throw "Existing Lucas configuration could not be read. Update aborted without changing local settings: $($_.Exception.Message)"
            }
          }'''
          if old not in s:
              raise SystemExit('existing config loader block not found')
          s = s.replace(old, new, 1)

          marker = '''$Config = [ordered]@{
            gateway_ws_url = $GatewayUrl.TrimEnd('/')
            node_id = $NodeId
            node_name = $ConfigNodeName
            pairing_code = $ConfigPairingCode
            permission_level = $ConfigPermission
            allowed_roots = $ConfigRoots
            connection_enabled = $ConnectionEnabled
            launch_at_startup = $LaunchAtStartup
            security = $SecurityConfig
          }
          $Config | ConvertTo-Json -Depth 10 | Set-Content -Path $ConfigFile -Encoding UTF8'''
          replacement = '''if ($ExistingConfig -and $ExistingConfigRaw) {
            # Updating an existing installation must preserve the complete local
            # configuration byte-for-byte. This intentionally retains unknown
            # future fields instead of rebuilding a partial allow-list of keys.
            $ExistingConfigRaw | Set-Content -Path $ConfigFile -Encoding UTF8
            $Config = Get-Content -Raw -Path $ConfigFile | ConvertFrom-Json -ErrorAction Stop
          } else {
            $Config = [ordered]@{
              gateway_ws_url = $GatewayUrl.TrimEnd('/')
              node_id = $NodeId
              node_name = $ConfigNodeName
              pairing_code = $ConfigPairingCode
              permission_level = $ConfigPermission
              allowed_roots = $ConfigRoots
              connection_enabled = $ConnectionEnabled
              launch_at_startup = $LaunchAtStartup
              security = $SecurityConfig
            }
            $Config | ConvertTo-Json -Depth 10 | Set-Content -Path $ConfigFile -Encoding UTF8
          }'''
          if marker not in s:
              raise SystemExit('config reconstruction block not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')

          q = Path('pyproject.toml')
          t = q.read_text(encoding='utf-8')
          t, n = re.subn(r'(?m)^version = "1\.7\.8"$', 'version = "1.7.9"', t, count=1)
          if n != 1:
              raise SystemExit('expected version 1.7.8')
          q.write_text(t, encoding='utf-8')
      - name: Add preservation regression test
        shell: python
        run: |
          from pathlib import Path
          p=Path('tests/test_install_config_preservation.py')
          p.write_text('''from pathlib import Path\n\n\ndef test_updater_preserves_complete_existing_config():\n    script = Path("scripts/install-node.ps1").read_text(encoding="utf-8")\n    assert "$ExistingConfigRaw" in script\n    assert "ConfigBackupFile" in script\n    assert "Update aborted without changing local settings" in script\n    assert "if ($ExistingConfig -and $ExistingConfigRaw)" in script\n    assert "$ExistingConfigRaw | Set-Content -Path $ConfigFile" in script\n    assert "unknown" in script.lower() or "future fields" in script.lower()\n''', encoding='utf-8')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          import py_compile
          for path in Path('src').rglob('*.py'):
              py_compile.compile(str(path), doraise=True)
          script = Path('scripts/install-node.ps1').read_text(encoding='utf-8')
          assert '$ExistingConfigRaw' in script
          assert 'ConfigBackupFile' in script
          assert 'Update aborted without changing local settings' in script
          assert 'if ($ExistingConfig -and $ExistingConfigRaw)' in script
          assert '$ExistingConfigRaw | Set-Content -Path $ConfigFile' in script
          print('config preservation validation passed')
      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-config-preservation-once.yml
      - name: Commit fix
        run: |
          git config user.name "Neal86"
          git config user.email "52608308+Neal86@users.noreply.github.com"
          git add -A
          git commit -m "Preserve all local settings across Node updates [skip ci]"
          git push
