name: Verify production UI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-production-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Verify lucasmcp.com homepage and pricing
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            echo "Production verification attempt ${attempt}/18"
            home="$(curl -fsSL --max-time 15 https://lucasmcp.com/ 2>/dev/null || true)"
            pricing="$(curl -fsSL --max-time 15 https://lucasmcp.com/pricing 2>/dev/null || true)"
            if [[ "$home" == *"position:sticky;top:0"* ]] \
              && [[ "$pricing" == *"Expansion Pack"* ]] \
              && [[ "$pricing" == *"1,000 Operations / month"* ]] \
              && [[ "$pricing" == *"10,000 Operations / month"* ]] \
              && [[ "$pricing" == *"30,000 Operations / month"* ]] \
              && [[ "$pricing" == *"Plans, pricing, and limits may change during Beta."* ]] \
              && [[ "$pricing" == *"position:sticky;top:0"* ]]; then
              echo "PRODUCTION_UI_VERIFIED"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not expose the expected UI before retry budget ended."
          exit 1
