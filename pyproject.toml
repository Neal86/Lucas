[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gpt-windows-connector"
version = "1.0.0"
description = "Remote-first Windows execution MCP for ChatGPT, Claude, Gemini and other MCP clients"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Neal Wang" }]
dependencies = [
  "mcp>=1.27,<2",
  "starlette>=0.47",
  "uvicorn>=0.35",
  "websockets>=15",
  "pydantic>=2.11",
  "psutil>=7.0",
  "pyautogui>=0.9.54; platform_system == 'Windows'",
  "pyperclip>=1.9; platform_system == 'Windows'",
  "pywinauto>=0.6.9; platform_system == 'Windows'",
  "pywin32>=311; platform_system == 'Windows'",
  "playwright>=1.54",
]

[project.scripts]
gwc-gateway = "gpt_windows_connector.gateway:main"
gwc-node = "gpt_windows_connector.node:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt_windows_connector"]
