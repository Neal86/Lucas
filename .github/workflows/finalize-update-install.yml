name: Finalize update install

on:
  push:
    paths:
      - '.github/workflows/finalize-update-install.yml'
      - '.github/scripts/finalize_update_install.py'

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final updater install patch
        run: python .github/scripts/finalize_update_install.py
      - name: Validate
        run: |
          python -m pip install -q pytest
          python -m compileall -q src
          python -m pytest -q tests/test_update_ui_contract.py tests/test_architecture_boundaries.py tests/test_install_config_preservation.py
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/install-node.ps1 tests/test_update_ui_contract.py
          git commit -m 'Update only changed Lucas dependencies'
          git push origin HEAD:main
