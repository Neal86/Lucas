name: Apply Lucas branding once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-branding-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare migration version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pyproject.toml')
          s=p.read_text(encoding='utf-8')
          if 'version = "1.7.5"' not in s:
              raise SystemExit('Expected Lucas 1.7.5 before branding migration')
          p.write_text(s.replace('version = "1.7.5"','version = "1.7.4"',1),encoding='utf-8')
          PY
      - name: Patch migration compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-branding.py')
          s=p.read_text(encoding='utf-8')
          old='''    count = text.count(old)\n    if count != 1:\n'''
          new='''    count = text.count(old)\n    if label == "web logo styles" and count >= 1:\n        return text.replace(old, new, 1)\n    if count != 1:\n'''
          if old not in s:
              raise SystemExit('Could not patch branding migration compatibility')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply branding
        run: python scripts/apply-branding.py
      - name: Set release version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pyproject.toml')
          s=p.read_text(encoding='utf-8')
          if 'version = "1.7.5"' not in s:
              raise SystemExit('Branding migration did not produce expected version')
          p.write_text(s.replace('version = "1.7.5"','version = "1.7.6"',1),encoding='utf-8')
          PY
      - name: Validate compile
        run: python -m compileall -q src
      - name: Remove one-time migration
        run: rm -f scripts/apply-branding.py .github/workflows/apply-branding-once.yml
      - name: Commit branding
        run: |
          git config user.name "Neal86"
          git config user.email "52608308+Neal86@users.noreply.github.com"
          git add -A
          git commit -m "Apply Lucas logo branding [skip ci]"
          git push
