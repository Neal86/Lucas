name: Extract update UI

on:
  push:
    paths:
      - '.github/workflows/extract-update-ui.yml'
      - '.github/scripts/extract_update_ui.py'

permissions:
  contents: write

jobs:
  extract:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract updater
        run: python .github/scripts/extract_update_ui.py
      - name: Validate extraction
        run: |
          python -m pip install -q pytest
          python -m compileall -q src
          python -m pytest -q tests/test_update_ui_contract.py tests/test_architecture_boundaries.py tests/test_install_config_preservation.py
      - name: Commit extraction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gpt_windows_connector/settings_ui.py tests/test_update_ui_contract.py
          git commit -m 'Extract updater from settings orchestrator'
          git push origin HEAD:main
