name: Retry Lucas connection management update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lucas-connection-management-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prepared patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/lucas-connection-management-patch.yml').read_text(encoding='utf-8')
          marker = "python - <<'PY'\n"
          block = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(block), '<lucas-patch>', 'exec'))
          PY
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate requested change
        run: |
          python -m compileall -q src
          python -m pytest -q tests/test_dashboard_connection_metadata.py tests/test_routing_isolation.py::test_admin_page_rejects_normal_user tests/test_routing_isolation.py::test_access_and_refresh_tokens_keep_same_user
          python - <<'PY'
          from pathlib import Path
          s = Path('src/gpt_windows_connector/webapp.py').read_text(encoding='utf-8')
          required = [
              'dashboard_node_metadata',
              'dashboard_ai_metadata',
              'async def api_node_name',
              'async def api_ai_connection',
              'saveNodeName()',
              'editAiConnection(',
              'deleteAiConnection(',
              'Route("/api/nodes/{node_id}/name"',
              'Route("/api/ai-connections/{client_id}"',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('missing requested implementation markers: '+', '.join(missing))
          PY
      - name: Commit patch and remove temporary workflows
        shell: bash
        run: |
          git config user.name "Lucas Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/lucas-connection-management-patch.yml .github/workflows/lucas-connection-management-retry.yml
          git add src/gpt_windows_connector/webapp.py tests/test_dashboard_connection_metadata.py
          git commit -m "Add editable node and AI connection metadata"
          git push origin HEAD:main
