name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest -q
      - name: Install Chromium for browser E2E
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python -m playwright install --with-deps chromium
      - name: Browser E2E
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        env:
          RUN_BROWSER_E2E: "1"
        run: pytest -q tests/test_browser_smoke.py

      - name: Install Chrome for extension protocol tests
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          curl -fsSL https://storage.googleapis.com/chrome-for-testing-public/133.0.6943.53/linux64/chrome-linux64.zip -o "$RUNNER_TEMP/lucas-chrome.zip"
          unzip -q "$RUNNER_TEMP/lucas-chrome.zip" -d "$RUNNER_TEMP/lucas-chrome"
      - name: Browser extension E2E via raw CDP
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        env:
          EXTENSION_TEST_CHROME: ${{ runner.temp }}/lucas-chrome/chrome-linux64/chrome
        run: pytest -q tests/test_browser_extension_e2e.py
