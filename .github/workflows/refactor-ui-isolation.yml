name: Lucas UI isolation refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-ui-isolation.yml'
      - 'scripts/refactor_ui_isolation.py'
      - 'scripts/fix_ui_refactor.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply safe UI isolation refactor
        run: |
          python scripts/refactor_ui_isolation.py
          python scripts/fix_ui_refactor.py
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile package
        run: python -m compileall -q src
      - name: Run complete test suite
        run: pytest -q
      - name: Remove one-shot machinery
        run: |
          rm scripts/refactor_ui_isolation.py
          rm scripts/fix_ui_refactor.py
          rm .github/workflows/refactor-ui-isolation.yml
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Split UI assets into isolated modules and restore approved homepage hero'
          git push origin HEAD:main
