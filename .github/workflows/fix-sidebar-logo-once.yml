name: Fix sidebar logo once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-sidebar-logo-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fix sidebar logo sizing
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/gpt_windows_connector/webapp.py')
          s = p.read_text(encoding='utf-8')
          old = '.side{background:#101828;color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:6px}.logo{font-size:18px;font-weight:750;padding:0 10px 22px}'
          new = '.side{background:#101828;color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:6px;overflow:hidden}.logo{height:64px;min-height:64px;padding:4px 10px 14px;overflow:hidden;display:flex;align-items:center;justify-content:flex-start}.logo img{display:block;width:100%;max-width:170px;height:46px;object-fit:contain;object-position:left center;filter:none!important;mix-blend-mode:normal!important}'
          if old not in s:
              raise SystemExit('sidebar logo css anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate
        run: python -m compileall -q src
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-sidebar-logo-once.yml
      - name: Commit fix
        run: |
          git config user.name "Neal86"
          git config user.email "52608308+Neal86@users.noreply.github.com"
          git add src/gpt_windows_connector/webapp.py .github/workflows/fix-sidebar-logo-once.yml
          git commit -m "Fix dashboard sidebar logo sizing [skip ci]"
          git push
