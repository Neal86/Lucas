services:
  gateway:
    build: .
    restart: unless-stopped
    expose:
      - "8787"
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.lucas-redirect.redirectscheme.scheme=https
      - traefik.http.routers.lucas-http.entrypoints=http
      - traefik.http.routers.lucas-http.rule=Host(`lucas.autozon.xyz`)
      - traefik.http.routers.lucas-http.middlewares=lucas-redirect
      - traefik.http.routers.lucas-https.entrypoints=https
      - traefik.http.routers.lucas-https.rule=Host(`lucas.autozon.xyz`)
      - traefik.http.routers.lucas-https.tls=true
      - traefik.http.routers.lucas-https.tls.certresolver=letsencrypt
      - traefik.http.routers.lucas-https.service=lucas-gateway
      - traefik.http.services.lucas-gateway.loadbalancer.server.port=8787
    environment:
      GWC_HOST: 0.0.0.0
      GWC_PORT: 8787
      GWC_DATA_DIR: /data
      GWC_PUBLIC_BASE_URL: ${GWC_PUBLIC_BASE_URL:-http://localhost:8787}
      GWC_JWT_SECRET: ${GWC_JWT_SECRET:-}
      GWC_JWT_TTL_SECONDS: ${GWC_JWT_TTL_SECONDS:-2592000}
      GWC_GOOGLE_CLIENT_ID: ${GWC_GOOGLE_CLIENT_ID:-}
      GWC_GOOGLE_CLIENT_SECRET: ${GWC_GOOGLE_CLIENT_SECRET:-}
      GWC_GOOGLE_REDIRECT_URI: ${GWC_GOOGLE_REDIRECT_URI:-}
      GWC_AUTH_SUCCESS_URL: ${GWC_AUTH_SUCCESS_URL:-}
      GWC_ALLOWED_HOSTS: ${GWC_ALLOWED_HOSTS:-}
      GWC_ALLOWED_ORIGINS: ${GWC_ALLOWED_ORIGINS:-}
    volumes:
      - gwc_data:/data

volumes:
  gwc_data:
