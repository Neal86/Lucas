services:
  gateway:
    build: .
    restart: unless-stopped
    expose:
      - "8787"
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.lucas-redirect.redirectscheme.scheme=https
      - traefik.http.routers.lucas-http.entrypoints=http
      - traefik.http.routers.lucas-http.rule=Host(`lucasmcp.com`)
      - traefik.http.routers.lucas-http.middlewares=lucas-redirect
      - traefik.http.routers.lucas-https.entrypoints=https
      - traefik.http.routers.lucas-https.rule=Host(`lucasmcp.com`)
      - traefik.http.routers.lucas-https.tls=true
      - traefik.http.routers.lucas-https.tls.certresolver=letsencrypt
      - traefik.http.routers.lucas-https.service=lucas-gateway
      - traefik.http.services.lucas-gateway.loadbalancer.server.port=8787
    environment:
      GWC_HOST: 0.0.0.0
      GWC_PORT: 8787
      GWC_DATA_DIR: /data
      GWC_PUBLIC_BASE_URL: https://lucasmcp.com
      GWC_SUPER_ADMIN_EMAIL: ${GWC_SUPER_ADMIN_EMAIL:-}
      GWC_JWT_SECRET: ${GWC_JWT_SECRET:-}
      GWC_JWT_TTL_SECONDS: ${GWC_JWT_TTL_SECONDS:-2592000}
      GWC_GOOGLE_CLIENT_ID: ${GWC_GOOGLE_CLIENT_ID:-}
      GWC_GOOGLE_CLIENT_SECRET: ${GWC_GOOGLE_CLIENT_SECRET:-}
      GWC_GOOGLE_REDIRECT_URI: ${GWC_GOOGLE_REDIRECT_URI:-}
      GWC_AUTH_SUCCESS_URL: ${GWC_AUTH_SUCCESS_URL:-}
      GWC_TURNSTILE_SITE_KEY: ${GWC_TURNSTILE_SITE_KEY:-}
      GWC_TURNSTILE_SECRET_KEY: ${GWC_TURNSTILE_SECRET_KEY:-}
      GWC_SMTP_HOST: ${GWC_SMTP_HOST:-}
      GWC_SMTP_PORT: ${GWC_SMTP_PORT:-587}
      GWC_SMTP_USERNAME: ${GWC_SMTP_USERNAME:-}
      GWC_SMTP_PASSWORD: ${GWC_SMTP_PASSWORD:-}
      GWC_SMTP_FROM: ${GWC_SMTP_FROM:-}
      GWC_SMTP_STARTTLS: ${GWC_SMTP_STARTTLS:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_PRO_PLUS: ${STRIPE_PRICE_PRO_PLUS:-}
      STRIPE_PRICE_PRO_ANNUAL: ${STRIPE_PRICE_PRO_ANNUAL:-}
      STRIPE_PRICE_PRO_PLUS_ANNUAL: ${STRIPE_PRICE_PRO_PLUS_ANNUAL:-}
      STRIPE_PRICE_EXPANSION_ANNUAL: ${STRIPE_PRICE_EXPANSION_ANNUAL:-}
      STRIPE_PRICE_EXPANSION: ${STRIPE_PRICE_EXPANSION:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE:-}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      GWC_ALLOWED_HOSTS: ${GWC_ALLOWED_HOSTS:-lucasmcp.com,lucasmcp.com:*,localhost:*,127.0.0.1:*}
      GWC_ALLOWED_ORIGINS: ${GWC_ALLOWED_ORIGINS:-https://lucasmcp.com,https://lucasmcp.com:*,http://localhost:*,http://127.0.0.1:*}
    volumes:
      - gwc_data:/data

volumes:
  gwc_data:
