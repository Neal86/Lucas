name: Repair complete web split

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-web-split.yml'
      - 'scripts/repair_web_split.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair complete web split
        run: python scripts/repair_web_split.py
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile package
        run: python -m compileall -q src
      - name: Run complete test suite
        run: pytest -q
      - name: Remove one-shot repair machinery
        run: |
          rm scripts/repair_web_split.py
          rm .github/workflows/repair-web-split.yml
      - name: Commit repaired split
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Repair complete landing split and lock full homepage regression coverage'
          git push origin HEAD:main
