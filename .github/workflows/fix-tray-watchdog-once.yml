name: Fix tray watchdog once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-tray-watchdog-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch tray resilience and startup watchdog
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          tray=Path('src/gpt_windows_connector/tray.py')
          s=tray.read_text(encoding='utf-8')
          old='''    def _make_icon(self, status: str) -> Any:\n        from PIL import Image, ImageDraw\n        asset = Path(__file__).with_name("assets") / "lucas-logo-square.png"\n        source = Image.open(asset).convert("RGBA")\n        source.thumbnail((58, 58), Image.Resampling.LANCZOS)\n        image = Image.new("RGBA", (64, 64), (255, 255, 255, 0))\n        image.alpha_composite(source, ((64 - source.width) // 2, (64 - source.height) // 2))\n'''
          new='''    def _make_icon(self, status: str) -> Any:\n        from PIL import Image, ImageDraw, ImageFont\n        image = Image.new("RGBA", (64, 64), (255, 255, 255, 0))\n        try:\n            asset = Path(__file__).with_name("assets") / "lucas-logo-square.png"\n            source = Image.open(asset).convert("RGBA")\n            source.thumbnail((58, 58), Image.Resampling.LANCZOS)\n            image.alpha_composite(source, ((64 - source.width) // 2, (64 - source.height) // 2))\n        except Exception:\n            # Branding must never be able to kill the background tray agent.\n            log.exception("Could not load Lucas tray logo; using built-in fallback")\n            draw = ImageDraw.Draw(image)\n            draw.rounded_rectangle((5, 5, 59, 59), radius=12, fill=(21, 94, 239, 255))\n            try:\n                font = ImageFont.truetype("arialbd.ttf", 34)\n            except Exception:\n                font = ImageFont.load_default()\n            box = draw.textbbox((0, 0), "L", font=font)\n            draw.text(((64-(box[2]-box[0]))/2, (64-(box[3]-box[1]))/2-2), "L", font=font, fill=(255,255,255,255))\n'''
          if old not in s: raise SystemExit('tray logo block not found')
          s=s.replace(old,new,1)
          tray.write_text(s,encoding='utf-8')

          ins=Path('scripts/install-node.ps1')
          p=ins.read_text(encoding='utf-8')
          old='''Write-Host "[Lucas] Starting in the Windows notification area..." -ForegroundColor Green\n# Start the tray directly for the current session. The scheduled task is the\n# watchdog for future logons/restarts; starting it here can be unreliable while\n# the installer is replacing the same runtime files.\nStart-Process -FilePath $VenvPythonw -ArgumentList "-m","gpt_windows_connector.tray" -WindowStyle Hidden\nStart-Sleep -Seconds 2\n'''
          new='''Write-Host "[Lucas] Starting in the Windows notification area..." -ForegroundColor Green\n# Start through Task Scheduler so Windows owns and supervises the tray process\n# immediately. If Task Scheduler cannot start it, fall back to direct launch.\n$TrayStarted = $false\ntry {\n  Start-ScheduledTask -TaskName $TaskName -ErrorAction Stop\n  Start-Sleep -Seconds 2\n  $TrayStarted = $true\n} catch {\n  Write-Host "[Lucas] Scheduled tray start failed; using direct fallback..." -ForegroundColor Yellow\n}\nif (-not $TrayStarted) {\n  Start-Process -FilePath $VenvPythonw -ArgumentList "-m","gpt_windows_connector.tray" -WindowStyle Hidden\n  Start-Sleep -Seconds 2\n}\n'''
          if old not in p: raise SystemExit('installer tray start block not found')
          p=p.replace(old,new,1)
          ins.write_text(p,encoding='utf-8')

          proj=Path('pyproject.toml')
          q=proj.read_text(encoding='utf-8')
          q,n=re.subn(r'(?m)^version = "1\.7\.7"$', 'version = "1.7.8"', q, count=1)
          if n!=1: raise SystemExit('expected version 1.7.7')
          proj.write_text(q,encoding='utf-8')
          PY
      - name: Validate compile
        run: python -m compileall -q src
      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-tray-watchdog-once.yml
      - name: Commit fix
        run: |
          git config user.name "Neal86"
          git config user.email "52608308+Neal86@users.noreply.github.com"
          git add -A
          git commit -m "Keep Lucas tray alive and supervised [skip ci]"
          git push
