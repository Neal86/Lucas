name: Final gateway trim

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-gateway-trim.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trim gateway comments
        run: python scripts/final_gateway_trim.py
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Unit tests
        run: pytest -q
      - name: Cleanup one-shot files
        run: git rm -f scripts/final_gateway_trim.py .github/workflows/final-gateway-trim.yml
      - name: Commit
        run: |
          git config user.name "Neal86"
          git config user.email "52608308+Neal86@users.noreply.github.com"
          git add -A
          git commit -m "Keep gateway within architecture boundary"
          git push origin HEAD:main
