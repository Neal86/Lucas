<!doctype html><meta charset="utf-8"><style>body{font:14px system-ui;max-width:620px;margin:32px auto;padding:0 20px}label{display:block;margin:14px 0 5px}input,select{width:100%;box-sizing:border-box;padding:9px}button{margin-top:18px;padding:9px 16px}.note{color:#64748b;margin-top:18px}</style><h2>Lucas Browser Bridge</h2><p>Give this browser profile a stable identity. Lucas can then target it by name, ID, alias, tag, or group.</p><label>Browser type</label><select id="browserType"><option value="ixbrowser">ixBrowser</option><option value="chrome">Chrome</option><option value="edge">Edge</option><option value="chromium">Chromium</option></select><label>Profile name</label><input id="profileName" placeholder="Jarvis"><label>Profile ID</label><input id="profileId" placeholder="11"><label>Alias</label><input id="alias" placeholder="jarvis"><label>Tags (comma separated)</label><input id="tags" placeholder="marketing, us"><label>Groups (comma separated)</label><input id="groups" placeholder="Marketing"><button id="save">Save</button><div id="result"></div><div class="note">After saving, Lucas Bridge reconnects automatically. Pairing and agent permissions are enforced by the local Lucas Node.</div><script src="options.js"></script>
