[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gpt-windows-connector"
version = "1.7.4"
description = "Multi-user remote Windows execution MCP with VPS web dashboard for ChatGPT, Claude, Gemini and other MCP clients"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Neal Wang" }]
dependencies = [
  "mcp>=1.27.2,<2",
  "starlette>=0.47,<1",
  "uvicorn>=0.35,<1",
  "websockets>=15,<16",
  "pydantic>=2.11,<3",
  "psutil>=7,<8",
  "playwright>=1.54,<2",
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=25.1,<26",
  "pyautogui>=0.9.54; platform_system == 'Windows'",
  "pyperclip>=1.9; platform_system == 'Windows'",
  "pywinauto>=0.6.9; platform_system == 'Windows'",
  "pywin32>=311; platform_system == 'Windows'",
  "pystray>=0.19.5,<1; platform_system == 'Windows'",
  "Pillow>=10,<12; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
gwc-gateway = "gpt_windows_connector.server:main"
gwc-node = "gpt_windows_connector.node:main"
lucas-node = "gpt_windows_connector.node:main"
lucas-tray = "gpt_windows_connector.tray:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt_windows_connector"]
