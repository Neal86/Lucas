name: Integrate referral dashboard
on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_referral_dashboard.py'
      - '.github/workflows/integrate-referral-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply referral dashboard changes
        run: python scripts/integrate_referral_dashboard.py
      - name: Fix generated referral nav escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/gpt_windows_connector/web_dashboard_markup.py')
          s=p.read_text()
          bad="onclick=\"view('referral',this)\""
          good="onclick=\"view(\\'referral\\',this)\""
          if bad not in s:
              raise SystemExit('generated referral nav marker not found')
          p.write_text(s.replace(bad,good,1))
          PY
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest -q
      - name: Cleanup one-shot files
        run: |
          rm scripts/integrate_referral_dashboard.py
          rm .github/workflows/integrate-referral-dashboard.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate Refer and Earn into dashboard and update rewards'
          git push origin HEAD:main
