name: Fix active computers
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_active_computers.py'
      - '.github/workflows/fix-active-computers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply active-computer changes
        run: python scripts/fix_active_computers.py
      - name: Fix generated migration details
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/gpt_windows_connector/web_core_runtime.py')
          s=p.read_text()
          bad="async function activateNode(nodeId){try{await api('/api/nodes/'+nodeId+'/activate',{method:'POST'});toast('Computer activated');await refresh()}catch(e){toast(e.message)}}"
          good="async function activateNode(nodeId){try{await api(\\'/api/nodes/\\'+nodeId+\\'/activate\\',{method:\\'POST\\'});toast(\\'Computer activated\\');await refresh()}catch(e){toast(e.message)}}"
          if bad not in s:
              raise SystemExit('activateNode escaping marker missing')
          p.write_text(s.replace(bad,good,1))

          p=Path('src/gpt_windows_connector/entitlements.py')
          s=p.read_text()
          bad='''    for node_id in candidates:\n        if node_id not in desired:\n            desired.append(node_id)\n        if len(desired)>=limit: break\n'''
          good='''    for node_id in candidates:\n        if len(desired)>=limit: break\n        if node_id not in desired:\n            desired.append(node_id)\n'''
          if bad not in s:
              raise SystemExit('active limit loop marker missing')
          p.write_text(s.replace(bad,good,1))
          PY
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest -q
      - name: Cleanup one-shot files
        run: |
          rm scripts/fix_active_computers.py
          rm .github/workflows/fix-active-computers.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Fix active computer selection for plan limits'
          git push origin HEAD:main
