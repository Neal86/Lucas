name: Prelaunch hardening
# retry after optional Turnstile fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prelaunch-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hardening
        run: |
          python scripts/prelaunch_apply.py
          python scripts/prelaunch_trim.py
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Unit tests
        run: pytest -q
      - name: Browser dependencies
        run: python -m playwright install --with-deps chromium
      - name: Browser E2E
        env:
          RUN_BROWSER_E2E: '1'
        run: pytest -q tests/test_browser_smoke.py
      - name: Cleanup one-shot migration files
        run: |
          git rm -f scripts/prelaunch_apply.py scripts/prelaunch_trim.py scripts/prelaunch_hardening.py .github/workflows/prelaunch-hardening.yml
          git rm -f scripts/adjust_annual_prices.py .github/workflows/adjust-annual-prices.yml || true
      - name: Commit final hardening
        run: |
          git config user.name "Neal86"
          git config user.email "52608308+Neal86@users.noreply.github.com"
          git add -A
          git commit -m "Complete prelaunch production hardening"
          git push origin HEAD:main
